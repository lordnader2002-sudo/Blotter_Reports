name: Probe Data Sources

# Diagnostic tool: runs scripts/probe_sources.py from a runner with open internet to
# discover/validate portal endpoints and field names. Results are read from the job log.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/probe_sources.py"
      - ".github/workflows/probe-sources.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Probe portals
        run: python scripts/probe_sources.py
