name: Daily Blotter Report

on:
  schedule:
    # 13:00 UTC ~= early morning across US time zones. Adjust as needed.
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # manual / backfill runs

permissions:
  contents: write  # commit the generated report back to the repo

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Generate report
        env:
          # Optional: higher Socrata rate limits. Runs fine unauthenticated too.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: blotter run --out reports/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blotter-report
          path: reports/latest/
          if-no-files-found: warn

      - name: Commit report
        run: |
          git config user.name "blotter-bot"
          git config user.email "blotter-bot@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore(report): daily blotter report $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
