# Global pipeline settings.

# How far back to pull incidents (days). Daily runs use a rolling window so a
# late-posted incident still shows up. Kept short — a wider window gets data-busy.
recency_window_days: 7

# Default search radius around each mall (meters). 1600 m ~= 1 mile.
# Override per-source with radius_m on a registry entry.
radius_m: 1600

# Max rows fetched per source per run. Hitting this flags the mall as "truncated".
result_limit: 5000

# Crime-type -> bucket mapping. Case-insensitive substring match against the raw
# crime-type string from each portal. Precedence is VIOLENT, PROPERTY,
# QUALITY_OF_LIFE, OTHER (first bucket with a hit wins). Unknown types -> OTHER.
# Per-city vocabularies differ, so extend these lists as you add malls.
crime_categories:
  VIOLENT:
    - assault
    - robbery
    - homicide
    - murder
    - shooting
    - rape
    - sexual
    - weapon
    - battery
    - kidnap
    - aggravated
  PROPERTY:
    - burglary
    - theft
    - larceny
    - shoplifting
    - stolen
    - motor vehicle
    - auto theft
    - vandalism
    - arson
    - fraud
    - vehicle break
    - property
  QUALITY_OF_LIFE:
    - trespass
    - disorderly
    - loitering
    - narcotic
    - drug
    - liquor
    - intoxicat
    - noise
    - vagrancy

# Optional bucket allow/deny lists. Empty keep_categories = keep all buckets.
keep_categories: []
drop_categories: []
