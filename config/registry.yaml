# Mall -> open-data crime source bindings (the pilot).
#
# Each entry maps a property_id (must exist in data/properties.csv) to one
# jurisdiction dataset and the portal-specific field names. All enabled entries
# below were VERIFIED LIVE via the CI probe (scripts/probe_sources.py — run it
# from the Actions tab after any registry change; results are in the job log).
#
# type: "socrata" | "arcgis"
#   socrata -> base_url + dataset_id. Datasets with separate lat/lon columns set
#              point_field + point_field_lon (bounding-box query, exact-radius
#              re-filter downstream); point_is_text for text-typed lat/lon.
#   arcgis  -> base_url is the FeatureServer LAYER url; AGOL-hosted services
#              want date_query_style: date_literal (epoch_ms 400s on them).

defaults:
  radius_m: 1000

sources:
  # --- Beverly Center, Los Angeles, CA ---
  # LAPD moved to NIBRS in 2024 and froze 2nrs-mtv8 (max date 2024-12-30).
  # k7nn-b2ep is "LAPD NIBRS Offenses 2026 to Present"; lat/lon are 100th-block
  # anonymized (hndrdth_*). Probe-verified columns.
  - property_id: BEVCENTER
    type: socrata
    name: "LAPD NIBRS Offenses 2026-present"
    base_url: "https://data.lacity.org"
    dataset_id: "k7nn-b2ep"
    point_field: "hndrdth_lat"
    point_field_lon: "hndrdth_lon"
    date_field: "date_occ"
    crime_type_field: "nibr_description"
    description_field: "weapon_desc"
    address_field: "hndrdth_loc_chk"
    incident_id_field: "uniquenibrno"

  # --- The Domain, Austin, TX — DISABLED ---
  # fdj4-gpfu ("Crime Reports") no longer exposes ANY location columns
  # (probe-verified via columns.json), so radius filtering is impossible.
  # Needs a replacement dataset with geo columns; shows as NO COVERAGE until then.
  - property_id: THEDOMAIN
    enabled: false
    type: socrata
    name: "Austin PD Crime Reports (geo columns removed upstream)"
    base_url: "https://data.austintexas.gov"
    dataset_id: "fdj4-gpfu"
    date_field: "occ_date"
    crime_type_field: "crime_type"

  # --- Opry Mills, Nashville, TN (official MNPD ArcGIS service; old Socrata
  #     portal retired). AGOL-hosted -> date_literal. Probe-verified. ---
  - property_id: OPRYMILLS
    type: arcgis
    name: "Metro Nashville PD Incidents"
    base_url: "https://services2.arcgis.com/HdTo6HJqh92wn4D8/arcgis/rest/services/Metro_Nashville_Police_Department_Incidents_view/FeatureServer/0"
    date_query_style: "date_literal"
    date_field: "Incident_Occurred"
    crime_type_field: "Offense_Description"
    description_field: "Weapon_Description"
    address_field: "Incident_Location"
    incident_id_field: "Primary_Key"

  # --- Northgate Station, Seattle, WA (SPD Crime Data). latitude/longitude are
  #     TEXT and contain 'REDACTED' rows -> point_is_text string comparison. ---
  - property_id: NORTHGATE
    type: socrata
    name: "Seattle PD Crime Data"
    base_url: "https://data.seattle.gov"
    dataset_id: "tazs-3rd5"
    point_field: "latitude"
    point_field_lon: "longitude"
    point_is_text: true
    date_field: "offense_date"
    crime_type_field: "nibrs_offense_code_description"
    description_field: "offense_category"
    address_field: "block_address"
    incident_id_field: "offense_id"

  # --- Cherry Creek, Denver, CO (official ODC service — layer id 324!).
  #     AGOL-hosted -> date_literal. Probe-verified fields + radius query. ---
  - property_id: CHERRYCREEK
    type: arcgis
    name: "Denver PD Crime"
    base_url: "https://services1.arcgis.com/zdB7qR0BtYrg0Xpl/arcgis/rest/services/ODC_CRIME_OFFENSES_P/FeatureServer/324"
    date_query_style: "date_literal"
    date_field: "FIRST_OCCURRENCE_DATE"
    crime_type_field: "OFFENSE_TYPE_ID"
    description_field: "OFFENSE_CATEGORY_ID"
    address_field: "INCIDENT_ADDRESS"
    incident_id_field: "OFFENSE_ID"

  # --- Lenox Square, Atlanta, GA — DISABLED ---
  # APD's portal is dashboard-only (DCAT catalog probe: Web Pages, no FeatureServer
  # or data downloads). Would need a COBRA CSV-download adapter; NO COVERAGE until then.
  - property_id: LENOX
    enabled: false
    type: arcgis
    name: "Atlanta PD (no public query API)"
    base_url: "https://atlanta-police-opendata-atlantapd.hub.arcgis.com"
    date_field: "occur_date"
    crime_type_field: "UC2_Literal"
