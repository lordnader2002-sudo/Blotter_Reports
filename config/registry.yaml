      agency: "Norfolk Police Department"
      agency_url: "https://www.norfolk.gov/police"

  # --- Castleton Square, Indianapolis — DISABLED ---
  # IMPD's NIBRS layer is fresh but publishes NO coordinates or addresses (zip/
