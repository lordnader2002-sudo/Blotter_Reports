# Mall -> open-data crime source bindings (the pilot).
#
# Each entry maps a property_id (must exist in data/properties.csv) to one
# jurisdiction dataset and the portal-specific field names. All enabled entries
# below were VERIFIED LIVE via the CI probe (scripts/probe_sources.py — run it
# from the Actions tab after any registry change; results are in the job log).
#
# type: "socrata" | "arcgis"
#   socrata -> base_url + dataset_id. Datasets with separate lat/lon columns set
#              point_field + point_field_lon (bounding-box query, exact-radius
#              re-filter downstream); point_is_text for text-typed lat/lon.
#   arcgis  -> base_url is the FeatureServer LAYER url; AGOL-hosted services
#              want date_query_style: date_literal (epoch_ms 400s on them).

defaults:
  radius_m: 1000

sources:
  # --- Beverly Center, Los Angeles, CA ---
  # LAPD moved to NIBRS in 2024 and froze 2nrs-mtv8 (max date 2024-12-30).
  # k7nn-b2ep is "LAPD NIBRS Offenses 2026 to Present"; lat/lon are 100th-block
  # anonymized (hndrdth_*). Probe-verified columns.
  - property_id: BEVCENTER
    type: socrata
    name: "LAPD NIBRS Offenses 2026-present"
    base_url: "https://data.lacity.org"
    dataset_id: "k7nn-b2ep"
    point_field: "hndrdth_lat"
    point_field_lon: "hndrdth_lon"
    date_field: "date_occ"
    crime_type_field: "nibr_description"
    description_field: "weapon_desc"
    address_field: "hndrdth_loc_chk"
    incident_id_field: "uniquenibrno"
    contact:
      agency: "Los Angeles Police Department"
      agency_url: "https://www.lapdonline.org"

  # --- The Domain, Austin, TX — DISABLED ---
  # fdj4-gpfu ("Crime Reports") no longer exposes ANY location columns
  # (probe-verified via columns.json), so radius filtering is impossible.
  # Needs a replacement dataset with geo columns; shows as NO COVERAGE until then.
  - property_id: THEDOMAIN
    enabled: false
    type: socrata
    name: "Austin PD Crime Reports (geo columns removed upstream)"
    base_url: "https://data.austintexas.gov"
    dataset_id: "fdj4-gpfu"
    date_field: "occ_date"
    crime_type_field: "crime_type"

  # --- Opry Mills, Nashville, TN (official MNPD ArcGIS service; old Socrata
  #     portal retired). AGOL-hosted -> date_literal. Probe-verified. ---
  - property_id: OPRYMILLS
    type: arcgis
    name: "Metro Nashville PD Incidents"
    base_url: "https://services2.arcgis.com/HdTo6HJqh92wn4D8/arcgis/rest/services/Metro_Nashville_Police_Department_Incidents_view/FeatureServer/0"
    date_query_style: "date_literal"
    date_field: "Incident_Occurred"
    crime_type_field: "Offense_Description"
    description_field: "Weapon_Description"
    address_field: "Incident_Location"
    incident_id_field: "Primary_Key"
    contact:
      agency: "Metro Nashville Police Department"
      agency_url: "https://www.nashville.gov/departments/police"

  # --- The Mall at Green Hills, Nashville, TN — same verified MNPD service as
  #     Opry Mills; different mall coordinates drive the radius query. ---
  - property_id: GREENHILLS
    type: arcgis
    name: "Metro Nashville PD Incidents"
    base_url: "https://services2.arcgis.com/HdTo6HJqh92wn4D8/arcgis/rest/services/Metro_Nashville_Police_Department_Incidents_view/FeatureServer/0"
    date_query_style: "date_literal"
    date_field: "Incident_Occurred"
    crime_type_field: "Offense_Description"
    description_field: "Weapon_Description"
    address_field: "Incident_Location"
    incident_id_field: "Primary_Key"
    contact:
      agency: "Metro Nashville Police Department"
      agency_url: "https://www.nashville.gov/departments/police"

  # --- Northgate Station, Seattle, WA (SPD Crime Data). latitude/longitude are
  #     TEXT and contain 'REDACTED' rows -> point_is_text string comparison. ---
  - property_id: NORTHGATE
    type: socrata
    name: "Seattle PD Crime Data"
    base_url: "https://data.seattle.gov"
    dataset_id: "tazs-3rd5"
    point_field: "latitude"
    point_field_lon: "longitude"
    point_is_text: true
    date_field: "offense_date"
    crime_type_field: "nibrs_offense_code_description"
    description_field: "offense_category"
    address_field: "block_address"
    incident_id_field: "offense_id"
    contact:
      agency: "Seattle Police Department"
      agency_url: "https://www.seattle.gov/police"

  # --- Cherry Creek, Denver, CO (official ODC service — layer id 324!).
  #     AGOL-hosted -> date_literal. Probe-verified fields + radius query. ---
  - property_id: CHERRYCREEK
    type: arcgis
    name: "Denver PD Crime"
    base_url: "https://services1.arcgis.com/zdB7qR0BtYrg0Xpl/arcgis/rest/services/ODC_CRIME_OFFENSES_P/FeatureServer/324"
    date_query_style: "date_literal"
    date_field: "FIRST_OCCURRENCE_DATE"
    crime_type_field: "OFFENSE_TYPE_ID"
    description_field: "OFFENSE_CATEGORY_ID"
    address_field: "INCIDENT_ADDRESS"
    incident_id_field: "OFFENSE_ID"
    contact:
      agency: "Denver Police Department"
      agency_url: "https://www.denvergov.org/Government/Agencies-Departments-Offices/Police-Department"

  # --- SouthPark, Charlotte, NC (CMPD Incidents — on-prem ArcGIS, probe-verified;
  #     DATE_INCIDENT_BEGAN is the occurrence date, not DATE_REPORTED). ---
  - property_id: SOUTHPARK
    type: arcgis
    name: "CMPD Incidents"
    base_url: "https://gis.charlottenc.gov/arcgis/rest/services/CMPD/CMPDIncidents/MapServer/0"
    date_query_style: "date_literal"
    date_field: "DATE_INCIDENT_BEGAN"
    crime_type_field: "HIGHEST_NIBRS_DESCRIPTION"
    description_field: "HIGHEST_NIBRS_CODE"
    address_field: "LOCATION"
    incident_id_field: "INCIDENT_REPORT_ID"
    contact:
      agency: "Charlotte-Mecklenburg Police Department"
      agency_url: "https://www.charlottenc.gov/CMPD"

  # --- Charlotte Premium Outlets (Steele Creek — inside Charlotte city, CMPD). ---
  - property_id: CHARLOTTE
    type: arcgis
    name: "CMPD Incidents"
    base_url: "https://gis.charlottenc.gov/arcgis/rest/services/CMPD/CMPDIncidents/MapServer/0"
    date_query_style: "date_literal"
    date_field: "DATE_INCIDENT_BEGAN"
    crime_type_field: "HIGHEST_NIBRS_DESCRIPTION"
    description_field: "HIGHEST_NIBRS_CODE"
    address_field: "LOCATION"
    incident_id_field: "INCIDENT_REPORT_ID"
    contact:
      agency: "Charlotte-Mecklenburg Police Department"
      agency_url: "https://www.charlottenc.gov/CMPD"

  # --- ABQ Uptown, Albuquerque, NM (APD Incidents — probe-verified; only a
  #     reported-date field exists and no native incident id). ---
  - property_id: ABQUP
    type: arcgis
    name: "Albuquerque PD Incidents"
    base_url: "https://services.arcgis.com/CWv1abTnC3urn4bV/arcgis/rest/services/Incidents/FeatureServer/0"
    date_query_style: "date_literal"
    date_field: "ReportDateTime"
    crime_type_field: "IncidentType"
    description_field: "CMLegend"
    address_field: "BlockAddress"
    contact:
      agency: "Albuquerque Police Department"
      agency_url: "https://www.cabq.gov/police"

  # --- International Plaza, Tampa, FL (TPD rolling-365-day crimes; occurfrdate
  #     is occurred-from — reportdate exists but is not used). Probe-verified. ---
  - property_id: INTLPLAZA
    type: arcgis
    name: "Tampa PD Crimes (365d)"
    base_url: "https://services1.arcgis.com/IbNXlmt2RVVRCZ6M/arcgis/rest/services/crimes_public_365days/FeatureServer/0"
    date_query_style: "date_literal"
    date_field: "occurfrdate"
    crime_type_field: "nibrsdesc"
    description_field: "nibrsoffense"
    address_field: "fulladdr"
    incident_id_field: "offenseid"
    contact:
      agency: "Tampa Police Department"
      agency_url: "https://www.tampa.gov/police"

  # --- Towne East Square, Wichita, KS (90-day rolling window; one row per
  #     offense — dedupe by INCREPORT collapses duplicates). Probe-verified. ---
  - property_id: TOWNEEAST
    type: arcgis
    name: "Wichita PD Crimes (90d)"
    base_url: "https://gismaps.wichita.gov/ageweb/rest/services/OpenData/Crime/MapServer/0"
    date_query_style: "date_literal"
    date_field: "STARTDATETIME"
    crime_type_field: "OFFENSE_DE"
    description_field: "CATEGORY"
    address_field: "PBADDRESS"
    incident_id_field: "INCREPORT"
    contact:
      agency: "Wichita Police Department"
      agency_url: "https://www.wichita.gov/police"

  # --- Arizona Mills, Tempe, AZ (General Offenses full-history dataset; our
  #     date filter scopes it — a 0-count would indicate a stale feed). ---
  - property_id: ARZMILLS
    type: arcgis
    name: "Tempe PD General Offenses"
    base_url: "https://services.arcgis.com/lQySeXwbBg53XWDi/arcgis/rest/services/General_Offenses_(Open_Data)/FeatureServer/0"
    date_query_style: "date_literal"
    date_field: "OccurrenceDatetime"
    crime_type_field: "OffenseCustom"
    description_field: "Offense"
    address_field: "ObfuscatedAddress"
    incident_id_field: "PrimaryKey"
    contact:
      agency: "Tempe Police Department"
      agency_url: "https://www.tempe.gov/government/police"

  # --- Lenox Square, Atlanta, GA — DISABLED ---
  # APD's portal is dashboard-only (DCAT catalog probe: Web Pages, no FeatureServer
  # or data downloads). Would need a COBRA CSV-download adapter; NO COVERAGE until then.
  - property_id: LENOX
    enabled: false
    type: arcgis
    name: "Atlanta PD (no public query API)"
    base_url: "https://atlanta-police-opendata-atlantapd.hub.arcgis.com"
    date_field: "occur_date"
    crime_type_field: "UC2_Literal"
