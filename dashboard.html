const Pill=({label,color})=><span style={{

const CatPill=({cat,t})=><Pill label={CAT_LABEL[cat]||cat} color={catColor(cat,t)}/>;

const Sparkline=({data,color,w=80,h=28})=>{
  if(!data||data.length<2) return null;
  const max=Math.max(...data),min=Math.min(...data),r=max-min||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-2-((v-min)/r)*(h-6)}`).join(' ');
  return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{display:'block'}}>
    <polygon points={`${pts} ${w},${h} 0,${h}`} fill={`${color}30`}/>
    <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>;
};

const MiniBar=({value,max,color,t})=><div style={{height:6,background:t.border,borderRadius:2,overflow:'hidden'}}>
  <div style={{width:`${max?Math.min(100,(value/max)*100):0}%`,height:'100%',background:color,borderRadius:2,transition:'width .4s ease'}}/>
</div>;

const StatCard=({t,label,value,sub,spark,color})=><div style={{
  flex:1,minWidth:0,background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:'18px 20px'}}>
  <div style={{...mono,fontSize:9.5,fontWeight:600,letterSpacing:'.13em',textTransform:'uppercase',color:t.textMuted,marginBottom:12}}>{label}</div>

      {sub&&<div style={{fontSize:11,color:t.textMuted,marginTop:8}}>{sub}</div>}
    </div>
    {spark&&<Sparkline data={spark} color={color||t.accent}/>}
  </div>
</div>;

const Card=({t,title,right,children,pad=true})=><div style={{

/* ═══ DATA + AUTH HOOKS (mirrors Protest-Tracker) ══════════════ */
function useData(authed){
  const [data,setData]=useState(null);
  const [err,setErr]=useState(null);
  useEffect(()=>{
    let cancelled=false;
    async function load(){
      try{
        let json;
        if(sb){
          if(!authed) return;
          const {data:blob,error}=await sb.storage.from(DATA_BUCKET).download(DATA_OBJECT);
          if(error) throw new Error(error.message||'download failed');
          json=JSON.parse(await blob.text());
        }else{
          const r=await fetch('dashboard_data.json');
          if(!r.ok) throw new Error(`HTTP ${r.status} — dashboard_data.json not found`);
          json=await r.json();
        }
        if(!cancelled) setData(json);
      }catch(e){ if(!cancelled) setErr(e.message); }
    }
    load();
    return ()=>{cancelled=true;};
  },[authed]);
  return {data,err};
}

function useAuth(){
  const [session,setSession]=useState(undefined);
  useEffect(()=>{
    if(!sb){ setSession(null); return; }
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  return {
    session,
    authed:  sb ? !!session : true,
    loading: sb ? session===undefined : false,
    login:   (password)=>sb.auth.signInWithPassword({email:SHARED_EMAIL,password}),
    logout:  ()=>sb&&sb.auth.signOut(),
  };
}

  if(id==='quality') return (data.coverage_gaps?.length||0)+(data.sources||[]).filter(s=>s.status==='FAILED').length||null;
  return null;
}

/* ═══ VIEWS ════════════════════════════════════════════════════ */
const Overview=({t,data,onRow})=>{
  const tot=data.totals||{};
  const covered=(data.malls||[]).filter(m=>m.status==='OK').length;
  const catMax=Math.max(1,...CATS.map(c=>tot[c]||0));
  const topMalls=[...(data.malls||[])].sort((a,b)=>(b.total||0)-(a.total||0)).slice(0,8);
  const mallMax=Math.max(1,...topMalls.map(m=>m.total||0));
  const trend=data.trend||[];
  const spark=trend.length>1?trend.map(x=>x.total):null;
  return <div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div style={{display:'flex',gap:12}}>
      <StatCard t={t} label="Total Incidents" value={tot.incidents??0} sub={`within ${data.radius_m||1000} m of malls`} spark={spark} color={t.accent}/>
      <StatCard t={t} label="Violent" value={tot.violent??0} sub="highest-severity bucket" color={t.critical}/>
      <StatCard t={t} label="Malls Covered" value={`${covered}/${data.malls?.length??0}`} sub="sources returning data"/>
      <StatCard t={t} label="Coverage Gaps" value={tot.coverage_gaps??0} sub="malls with no source" color={(tot.coverage_gaps?t.high:t.low)}/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
      <Card t={t} title="By category">
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {CATS.map(c=><div key={c}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
              <span style={{display:'flex',alignItems:'center',gap:8,fontSize:12,color:t.textSub}}>
                <CatPill cat={c} t={t}/></span>
              <span style={{...mono,fontSize:12,fontWeight:600,color:t.text}}>{tot[c]||0}</span>
            </div>
            <MiniBar value={tot[c]||0} max={catMax} color={catColor(c,t)} t={t}/>
          </div>)}
        </div>
      </Card>
      <Card t={t} title="Top malls by incidents">
        <div style={{display:'flex',flexDirection:'column',gap:11}}>
          {topMalls.length===0&&<span style={{fontSize:12,color:t.textMuted}}>No incidents in window.</span>}

            <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
              <span style={{fontSize:12,color:t.textSub,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.property_name||m.property_id}</span>
              <span style={{...mono,fontSize:12,fontWeight:600,color:t.text}}>{m.total||0}</span>
            </div>
            <MiniBar value={m.total||0} max={mallMax} color={t.accent} t={t}/>
          </div>)}

};

      borderRadius:12,boxShadow:'0 24px 60px rgba(0,0,0,.45)'}}>

        alignItems:'flex-start',gap:12}}>

          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
            <CatPill cat={inc.crime_category} t={t}/>
            <span style={{fontSize:14.5,fontWeight:700,color:t.text}}>{inc.crime_type||'Incident'}</span>
          </div>
          <div style={{...mono,fontSize:11,color:t.textMuted,marginTop:5}}>
            {inc.property_name} · {fmtDate(inc.occurred_at)} · {fmtM(inc.distance_m)} from mall
            {inc.incident_id?` · case ${inc.incident_id}`:''}
          </div>
        </div>
        <button onClick={onClose} style={{background:'transparent',border:'none',color:t.textMuted,
          cursor:'pointer',fontSize:18,lineHeight:1,padding:4}}>✕</button>
      </div>
      <div style={{padding:'16px 20px',overflowY:'auto'}}>
        <div style={{...mono,fontSize:9.5,fontWeight:600,letterSpacing:'.13em',textTransform:'uppercase',
          color:t.textMuted,marginBottom:8}}>Synopsis</div>

          border:`1px solid ${t.accent}30`,borderRadius:8,padding:'12px 14px'}}>
          {inc.synopsis||'No additional context published by the source.'}</div>
        {keys.length>0&&<div style={{marginTop:16}}>
          <div style={{...mono,fontSize:9.5,fontWeight:600,letterSpacing:'.13em',textTransform:'uppercase',

              {keys.map(k=><tr key={k} style={{borderBottom:`1px solid ${t.border}`}}>
                <td style={{...mono,padding:'6px 10px 6px 0',color:t.textMuted,fontSize:10.5,
                  whiteSpace:'nowrap',verticalAlign:'top'}}>{k}</td>
                <td style={{padding:'6px 0',color:t.textSub}}>{details[k]}</td>
              </tr>)}
            </tbody>
          </table>
        </div>}
        <div style={{fontSize:10.5,color:t.textMuted,marginTop:14,lineHeight:1.5}}>
          Police open-data feeds omit the narrative report. For the full account, submit a records
          request to the agency citing the case number above.</div>
      </div>
    </div>
  </div>;
};

const COLS=[
  {key:'property_name',label:'Mall'},
  {key:'occurred_at',label:'Date'},
  {key:'crime_category',label:'Category'},
  {key:'crime_type',label:'Type'},
  {key:'distance_m',label:'Distance'},
  {key:'address',label:'Address'},
];
const IncidentTable=({t,rows,compact,onRow})=>{
  const [sortCol,setSortCol]=useState('occurred_at');
  const [asc,setAsc]=useState(false);
  const sorted=useMemo(()=>{
    const r=[...rows];
    r.sort((a,b)=>{
      let va=a[sortCol],vb=b[sortCol];
      if(sortCol==='distance_m'){va=va??1e12;vb=vb??1e12;}
      else{va=String(va??'').toLowerCase();vb=String(vb??'').toLowerCase();}
      if(va<vb)return asc?-1:1; if(va>vb)return asc?1:-1; return 0;
    });
    return r;
  },[rows,sortCol,asc]);
  const th=(c)=><th key={c.key} onClick={()=>{ if(sortCol===c.key)setAsc(!asc); else{setSortCol(c.key);setAsc(c.key==='distance_m');} }}
    style={{...mono,fontSize:9.5,fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',
      color:t.textMuted,textAlign:'left',padding:'10px 14px',cursor:'pointer',
      borderBottom:`1px solid ${t.border}`,whiteSpace:'nowrap',userSelect:'none',position:'sticky',top:0,background:t.surface}}>
    {c.label}{sortCol===c.key?(asc?' ▲':' ▼'):''}</th>;
  return <div style={{overflow:'auto',maxHeight:compact?320:'calc(100vh - 200px)'}}>
    <table style={{width:'100%',borderCollapse:'collapse',fontSize:12.5}}>
      <thead><tr>{COLS.map(th)}</tr></thead>
      <tbody>
        {sorted.length===0&&<tr><td colSpan={COLS.length} style={{padding:18,color:t.textMuted,fontSize:12}}>No incidents.</td></tr>}
        {sorted.map((r,i)=><tr key={i} onClick={()=>onRow&&onRow(r)}
          style={{borderBottom:`1px solid ${t.border}`,cursor:onRow?'pointer':'default'}}
          onMouseEnter={e=>{if(onRow)e.currentTarget.style.background=t.bg;}}
          onMouseLeave={e=>{e.currentTarget.style.background='transparent';}}>
          <td style={{padding:'9px 14px',color:t.text,whiteSpace:'nowrap'}}>{r.property_name}</td>
          <td style={{padding:'9px 14px',color:t.textSub,...mono,fontSize:11.5,whiteSpace:'nowrap'}}>{fmtDate(r.occurred_at)}</td>
          <td style={{padding:'9px 14px'}}><CatPill cat={r.crime_category} t={t}/></td>
          <td style={{padding:'9px 14px',color:t.textSub}}>{r.crime_type||'—'}</td>
          <td style={{padding:'9px 14px',...mono,fontSize:11.5,color:t.text}}>{fmtM(r.distance_m)}</td>
          <td style={{padding:'9px 14px',color:t.textMuted,maxWidth:280,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.address||'—'}</td>
        </tr>)}
      </tbody>
    </table>
  </div>;
};

const Incidents=({t,data,query,onRow})=>{
  const [cat,setCat]=useState('');
  const [mall,setMall]=useState('');
  const malls=[...new Set((data.incidents||[]).map(r=>r.property_name))].sort();
  const rows=(data.incidents||[]).filter(r=>{
    if(cat&&r.crime_category!==cat) return false;
    if(mall&&r.property_name!==mall) return false;
    if(query){ const hay=`${r.property_name} ${r.crime_type} ${r.address} ${r.crime_category}`.toLowerCase();
      if(!hay.includes(query.toLowerCase())) return false; }
    return true;
  });
  const sel={height:32,background:t.surface,border:`1px solid ${t.border}`,borderRadius:7,
    padding:'0 10px',color:t.text,fontSize:12,outline:'none'};
  return <div style={{display:'flex',flexDirection:'column',gap:12}}>
    <div style={{display:'flex',gap:10,alignItems:'center'}}>
      <select value={cat} onChange={e=>setCat(e.target.value)} style={sel}>
        <option value="">All categories</option>
        {CATS.map(c=><option key={c} value={c}>{CAT_LABEL[c]}</option>)}
      </select>
      <select value={mall} onChange={e=>setMall(e.target.value)} style={sel}>
        <option value="">All malls</option>
        {malls.map(m=><option key={m} value={m}>{m}</option>)}
      </select>
      <span style={{...mono,fontSize:11.5,color:t.textMuted,marginLeft:'auto'}}>{rows.length} incidents</span>
    </div>
    <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,overflow:'hidden'}}>
      <IncidentTable t={t} rows={rows} onRow={onRow}/>
    </div>
  </div>;
};

/* Per-mall drill-in: incident list, daily + run-over-run trend, source contact. */
const axisTitle=(t,text)=>({display:!!text,text,color:t.textSub,font:{family:'Inter',size:11}});

const DailyBars=({t,rows,windowDays,height=200,xTitle,yTitle})=>{
  const ref=useRef(null); const chartRef=useRef(null);
  useEffect(()=>{
    if(!ref.current||!window.Chart) return;
    if(chartRef.current) chartRef.current.destroy();
    const days=[];
    for(let i=windowDays-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);
      days.push(d.toISOString().slice(0,10));}
    const bucket=(cat)=>days.map(day=>rows.filter(r=>
      (r.occurred_at||'').slice(0,10)===day&&r.crime_category===cat).length);
    const ds=(cat)=>({label:CAT_LABEL[cat],data:bucket(cat),
      backgroundColor:catColor(cat,t),borderRadius:3,stack:'s'});
    chartRef.current=new Chart(ref.current,{type:'bar',
      data:{labels:days.map(d=>d.slice(5)),datasets:CATS.map(ds)},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:t.textSub,font:{family:'Inter',size:10}}}},
        scales:{x:{stacked:true,ticks:{color:t.textMuted},grid:{display:false},
                   title:axisTitle(t,xTitle)},
                y:{stacked:true,ticks:{color:t.textMuted,precision:0},grid:{color:t.border},
                   title:axisTitle(t,yTitle)}}}});
    return ()=>chartRef.current&&chartRef.current.destroy();
  },[rows,t,windowDays,xTitle,yTitle]);
  return <div style={{height}}><canvas ref={ref}/></div>;
};

/* Run-over-run history: the trend ledger logs every pipeline run, so collapse
   to the LAST run of each calendar day for a readable series. */
const RunHistory=({t,trend})=>{
  const ref=useRef(null); const chartRef=useRef(null);
  const byDay={};
  (trend||[]).forEach(x=>{const d=(x.ts||'').slice(0,10); if(d) byDay[d]=x;});
  const days=Object.keys(byDay).sort();
  useEffect(()=>{
    if(!ref.current||!window.Chart||days.length<2) return;
    if(chartRef.current) chartRef.current.destroy();
    const line=(label,key,color)=>({label,data:days.map(d=>byDay[d][key]||0),
      borderColor:color,backgroundColor:`${color}30`,fill:key==='total',
      tension:.3,pointRadius:3,borderWidth:2});
    chartRef.current=new Chart(ref.current,{type:'line',
      data:{labels:days.map(d=>d.slice(5)),
        datasets:[line('All incidents in window','total',t.accent),
                  line('Violent','violent',t.critical)]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:t.textSub,font:{family:'Inter',size:10}}}},
        scales:{x:{ticks:{color:t.textMuted},grid:{display:false},
                   title:axisTitle(t,'Report run date (one point per day)')},
                y:{ticks:{color:t.textMuted,precision:0},grid:{color:t.border},
                   title:axisTitle(t,'Incidents in the window at that run')}}}});
    return ()=>chartRef.current&&chartRef.current.destroy();
  },[trend,t]);
  if(days.length<2) return <div style={{fontSize:12,color:t.textMuted,padding:16}}>
    History builds one point per daily run — a line appears after the second day.</div>;
  return <div style={{height:240}}><canvas ref={ref}/></div>;
};

const MapView=({t,data})=>{
  const ref=useRef(null); const mapRef=useRef(null);
  useEffect(()=>{
    if(!ref.current||!window.L) return;
    if(mapRef.current){ mapRef.current.invalidateSize(); return; }
    const m=L.map(ref.current,{zoomControl:true}).setView([39.5,-98.35],4);
    const dark=t.bg==='#0a0e14';
    L.tileLayer(dark
      ? "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
      : "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(m);
    const bounds=[];
    (data.malls||[]).forEach(mk=>{ if(mk.lat==null||mk.lon==null) return;
      L.circleMarker([mk.lat,mk.lon],{radius:7,fillColor:t.accent,color:'#0a0e14',weight:2,fillOpacity:1})
        .bindPopup(`<b>${mk.property_name||mk.property_id}</b><br>${mk.total||0} incidents`).addTo(m);
      bounds.push([mk.lat,mk.lon]);
    });
    (data.incidents||[]).forEach(ev=>{ if(ev.lat==null||ev.lon==null) return;
      const c=catColor(ev.crime_category,t);
      const syn=ev.synopsis?`<div style="margin-top:6px;max-width:260px">${ev.synopsis}</div>`:'';
      L.circleMarker([ev.lat,ev.lon],{radius:5,fillColor:c,color:'#fff',weight:1,fillOpacity:.85})
        .bindPopup(`<b>${ev.crime_type||ev.crime_category}</b><br>${CAT_LABEL[ev.crime_category]||''} · ${fmtM(ev.distance_m)}<br>${fmtDate(ev.occurred_at)} — ${ev.property_name}${syn}`,
          {maxWidth:300}).addTo(m);
      bounds.push([ev.lat,ev.lon]);
    });
    if(bounds.length) m.fitBounds(bounds,{padding:[40,40],maxZoom:13});
    mapRef.current=m;
  },[data,t]);
  return <div style={{position:'relative'}}>
    <div ref={ref} style={{height:'calc(100vh - 108px)',width:'100%',borderRadius:8,overflow:'hidden',border:`1px solid ${t.border}`}}/>
    <div style={{position:'absolute',right:14,bottom:14,zIndex:500,background:t.surface,border:`1px solid ${t.border}`,
      borderRadius:8,padding:'10px 12px',fontSize:10.5}}>
      <div style={{...mono,fontSize:9,letterSpacing:'.1em',color:t.textMuted,marginBottom:6}}>CATEGORY</div>
      {CATS.map(c=><div key={c} style={{display:'flex',alignItems:'center',gap:7,marginTop:3,color:t.textSub}}>
        <span style={{width:9,height:9,borderRadius:9,background:catColor(c,t),display:'inline-block'}}/>{CAT_LABEL[c]}</div>)}
      <div style={{display:'flex',alignItems:'center',gap:7,marginTop:6,paddingTop:6,borderTop:`1px solid ${t.border}`,color:t.textSub}}>
        <span style={{width:9,height:9,borderRadius:2,background:t.accent,display:'inline-block'}}/>Mall</div>
    </div>
  </div>;
};

const Trends=({t,data})=>{
  const rows=data.incidents||[];
  return <div style={{display:'flex',flexDirection:'column',gap:16}}>
    <Card t={t} title={`When incidents occurred — all malls, last ${data.window_days||7} days`}>

const Quality=({t,data})=>{

  const uncovered=[...(data.uncovered||[])].sort((a,b)=>

        <tbody>
          {sources.length===0&&<tr><td colSpan={5} style={{padding:18,color:t.textMuted}}>No source runs recorded.</td></tr>}

            <td style={{padding:'9px 14px',color:t.textSub}}>{s.name}</td>
            <td style={{padding:'9px 14px'}}><Pill label={s.status} color={statusColor(s.status,t)}/></td>
            <td style={{padding:'9px 14px',...mono,fontSize:11.5,color:t.text}}>{s.fetched_count}{s.truncated?'+':''}</td>
            <td style={{padding:'9px 14px',color:t.textMuted,maxWidth:360,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.error||(s.truncated?'results truncated':'—')}</td>
          </tr>)}
        </tbody>
      </table>
    </Card>
  </div>;
};

/* ═══ LOGIN ════════════════════════════════════════════════════ */
const LoginScreen=({t,onLogin})=>{
  const [pw,setPw]=useState(''); const [err,setErr]=useState(null); const [busy,setBusy]=useState(false);
  const submit=async(e)=>{ e.preventDefault(); setBusy(true); setErr(null);
    const {error}=await onLogin(pw); if(error) setErr(error.message||'Login failed'); setBusy(false); };
  return <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:t.bg}}>
    <form onSubmit={submit} style={{width:320,background:t.surface,border:`1px solid ${t.border}`,
      borderRadius:12,padding:28}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:18}}>
        <div style={{width:32,height:32,borderRadius:8,background:t.accent,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <span style={{...mono,fontSize:14,fontWeight:800,color:'#0a0e14'}}>BR</span></div>
        <div style={{fontSize:15,fontWeight:700,color:t.text}}>Blotter Reports</div>
      </div>
      <label style={{...mono,fontSize:9.5,letterSpacing:'.1em',color:t.textMuted,textTransform:'uppercase'}}>Shared password</label>
      <input type="password" value={pw} onChange={e=>setPw(e.target.value)} autoFocus
        style={{width:'100%',height:38,marginTop:6,background:t.bg,border:`1px solid ${t.border}`,
          borderRadius:8,padding:'0 12px',color:t.text,fontSize:13,outline:'none'}}/>
      {err&&<div style={{color:t.critical,fontSize:11.5,marginTop:8}}>{err}</div>}
      <button type="submit" disabled={busy} style={{width:'100%',height:38,marginTop:14,background:t.accent,
        border:'none',borderRadius:8,color:'#0a0e14',fontSize:13,fontWeight:700,cursor:'pointer',opacity:busy?.6:1}}>
        {busy?'…':'Enter'}</button>
    </form>
  </div>;
};

/* ═══ APP ══════════════════════════════════════════════════════ */
const App=()=>{
  const [dark,setDark]=useState(()=>localStorage.getItem('br_theme')!=='daylight');
  const t=dark?THEMES.midnight:THEMES.daylight;
  const [view,setView]=useState('dashboard');
  const [query,setQuery]=useState('');
  const [detail,setDetail]=useState(null);  // incident shown in the context modal
  const [mall,setMall]=useState(null);      // mall drill-in page (By Mall tab)
  const {authed,loading,login,logout}=useAuth();
  const {data,err}=useData(authed);
  const toggleDark=()=>{ const nx=!dark; setDark(nx); localStorage.setItem('br_theme',nx?'midnight':'daylight'); };

  useEffect(()=>{ document.body.style.background=t.bg; },[t]);

  if(loading) return <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
    background:t.bg,color:t.textMuted,...mono,fontSize:12}}>Loading…</div>;
  if(sb&&!authed) return <LoginScreen t={t} onLogin={login}/>;

  const body=()=>{
    if(err) return <div style={{color:t.critical,fontSize:13,padding:20}}>Failed to load data: {err}
      <div style={{color:t.textMuted,fontSize:11.5,marginTop:8}}>Expecting <code>dashboard_data.json</code> beside this page (run <code>blotter run</code>).</div></div>;
    if(!data) return <div style={{color:t.textMuted,...mono,fontSize:12,padding:20}}>Loading data…</div>;
    switch(view){
      case 'incidents': return <Incidents t={t} data={data} query={query} onRow={setDetail}/>;
      case 'malls':     return mall
        ? <MallDetail t={t} data={data} mall={mall} onBack={()=>setMall(null)} onRow={setDetail}/>
        : <Malls t={t} data={data} onSelect={setMall}/>;
      case 'map':       return <MapView t={t} data={data}/>;
      case 'trends':    return <Trends t={t} data={data}/>;
      case 'quality':   return <Quality t={t} data={data}/>;
      default:          return <Overview t={t} data={data} onRow={setDetail}/>;
    }
  };

  const nav=(v)=>{ setView(v); setMall(null); };  // sidebar always resets the drill-in
  return <div style={{display:'flex',height:'100vh',background:t.bg}}>
    <Sidebar t={t} view={view} setView={nav} data={data} onLogout={sb?logout:null}/>
    <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
      <TopBar t={t} view={view} data={data} dark={dark} toggleDark={toggleDark} query={query} setQuery={setQuery}/>
      <main style={{flex:1,overflow:'auto',padding:22}}>{body()}</main>
    </div>
    <DetailModal t={t} inc={detail} onClose={()=>setDetail(null)}/>
  </div>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
